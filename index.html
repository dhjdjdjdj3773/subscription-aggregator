<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Автоматический VPN Агрегатор</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: #0f172a; color: #e2e8f0; padding: 20px; }
        header { text-align: center; max-width: 600px; margin: 0 auto 30px auto; }
        h1 { font-size: 28px; margin-bottom: 10px; color: #38bdf8; }
        p { color: #94a3b8; font-size: 15px; margin-bottom: 20px; }
        
        .start-btn { padding: 15px 40px; background: #22c55e; border: none; border-radius: 8px; color: #fff; font-weight: bold; font-size: 16px; cursor: pointer; box-shadow: 0 4px 14px rgba(34, 197, 94, 0.4); transition: 0.2s; margin-bottom: 15px; }
        .start-btn:hover { background: #16a34a; transform: scale(1.02); }
        .start-btn:active { transform: scale(0.98); }
        
        .status { text-align: center; color: #38bdf8; margin-bottom: 5px; font-size: 14px; font-weight: 500; }
        .timer { text-align: center; color: #64748b; margin-bottom: 20px; font-size: 12px; display: none; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; max-width: 1200px; margin: 0 auto; }
        .card { background: #1e293b; border: 1px solid #334155; padding: 20px; border-radius: 12px; display: flex; flex-direction: column; justify-content: space-between; }
        .type-badge { display: inline-block; padding: 4px 8px; background: #0369a1; color: #e0f2fe; border-radius: 6px; font-size: 11px; font-weight: bold; text-transform: uppercase; margin-bottom: 10px; align-self: flex-start; }
        .card h3 { font-size: 16px; margin-bottom: 10px; word-break: break-all; color: #f8fafc; }
        .key-box { background: #0f172a; padding: 10px; border-radius: 6px; font-family: monospace; font-size: 12px; max-height: 80px; overflow-y: auto; word-break: break-all; border: 1px solid #1e293b; margin-bottom: 15px; color: #cbd5e1; }
        .copy-btn { width: 100%; padding: 10px; background: #334155; color: #fff; border: none; border-radius: 6px; cursor: pointer; font-weight: 500; font-size: 13px; transition: 0.2s; }
        .copy-btn:hover { background: #475569; }
        .copy-btn.success { background: #22c55e; color: #fff; }
    </style>
</head>
<body>

    <header>
        <h1>VPN Key Aggregator</h1>
        <p>Сбор конфигураций из репозитория whoahaow через официальный API GitHub</p>
        
        <button class="start-btn" id="startBtn" onclick="manualStart()">Начать поиск</button>
        
        <div class="status" id="status">Нажмите кнопку выше, чтобы запустить поиск ключей...</div>
        <div class="timer" id="timer">До обновления: 03:00:00</div>
    </header>

    <div class="grid" id="container"></div>

    <script>
        const GITHUB_API_URL = 'https://github.com';
        const UPDATE_INTERVAL = 3 * 60 * 60 * 1000; 
        
        let allKeys = [];
        let timeLeft = UPDATE_INTERVAL;
        let timerInterval;

        function manualStart() {
            document.getElementById('startBtn').style.display = 'none'; 
            document.getElementById('timer').style.display = 'block';
            document.getElementById('status').innerText = "Процесс запущен. Пожалуйста, подождите...";
            fetchKeys(); 
        }

        async function fetchKeys() {
            const statusEl = document.getElementById('status');
            statusEl.innerText = "Процесс запущен...";
            
            try {
                const response = await fetch(`${GITHUB_API_URL}?t=${Date.now()}`);
                if (!response.ok) throw new Error("API вернул ошибку");
                
                const data = await response.json();
                
                // Исправленный метод декодирования: удаляем пробелы/переносы строк и безопасно переводим из Base64 в текст UTF-8
                const base64Clean = data.content.replace(/\s/g, '');
                const binaryString = atob(base64Clean);
                const bytes = new Uint8Array(binaryString.length);
                for (let i = 0; i < binaryString.length; i++) {
                    bytes[i] = binaryString.charCodeAt(i);
                }
                const text = new TextDecoder('utf-8').decode(bytes);
                
                const lines = text.split('\n').map(line => line.trim()).filter(line => line.length > 10);
                if (lines.length === 0) throw new Error("Файл пуст");

                allKeys = lines.map((key, index) => {
                    let type = "UNKNOWN";
                    if (key.startsWith("vless://")) type = "VLESS";
                    else if (key.startsWith("vmess://")) type = "VMess";
                    else if (key.startsWith("ss://")) type = "Shadowsocks";
                    else if (key.startsWith("ssr://")) type = "Shadowsocks R";
                    else if (key.startsWith("trojan://")) type = "Trojan";

                    const newName = `Бесплатный VPN #${index + 1}`;

                    let cleanKey = key;
                    if (key.includes('#')) {
                        cleanKey = key.split('#')[0];
                    }
                    
                    let finalKey = cleanKey;
                    if (type !== "VMess") {
                        finalKey = `${cleanKey}#${encodeURIComponent(newName)}`;
                    }

                    return { type, name: newName, rawKey: finalKey };
                });

                statusEl.innerText = `🟢 Процесс успешно завершен! Найдено и переименовано ключей: ${allKeys.length}`;
                render(allKeys);
                resetTimer();

            } catch (error) {
                console.error(error);
                statusEl.innerText = "🔴 Ошибка обработки данных. Пожалуйста, попробуйте нажать кнопку еще раз.";
                document.getElementById('startBtn').style.display = 'inline-block';
                document.getElementById('timer').style.display = 'none';
            }
        }

        function resetTimer() {
            clearInterval(timerInterval);
            timeLeft = UPDATE_INTERVAL;
            updateTimerDisplay();
            
            timerInterval = setInterval(() => {
                timeLeft -= 1000;
                if (timeLeft <= 0) {
                    fetchKeys(); 
                } else {
                    updateTimerDisplay();
                }
            }, 1000);
        }

        function updateTimerDisplay() {
            const hours = Math.floor(timeLeft / (1000 * 60 * 60));
            const minutes = Math.floor((timeLeft % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((timeLeft % (1000 * 60)) / 1000);
            
            const pad = (num) => String(num).padStart(2, '0');
            document.getElementById('timer').innerText = `Следующее фоновое автообновление через: ${pad(hours)}:${pad(minutes)}:${pad(seconds)}`;
        }

        function render(data) {
            const container = document.getElementById('container');
            container.innerHTML = data.map((item, idx) => `
                <div class="card">
                    <div>
                        <span class="type-badge">${item.type}</span>
                        <h3>${escapeHtml(item.name)}</h3>
                        <div class="key-box" id="key-${idx}">${escapeHtml(item.rawKey)}</div>
                    </div>
                    <button class="copy-btn" onclick="copyToClipboard('key-${idx}', this)">Копировать ключ</button>
                </div>
            `).join('');
        }

        async function copyToClipboard(elementId, button) {
            const text = document.getElementById(elementId).innerText;
            try {
                await navigator.clipboard.writeText(text);
                const originalText = button.innerText;
                button.innerText = "Скопировано!";
                button.classList.add('success');
                setTimeout(() => {
                    button.innerText = originalText;
                    button.classList.remove('success');
                }, 1500);
            } catch (err) {
                alert('Не удалось скопировать');
            }
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
    </script>
</body>
</html>
