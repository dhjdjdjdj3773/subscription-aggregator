<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мониторинг VPN Ключей</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: #0f172a; color: #e2e8f0; padding: 20px; }
        header { text-align: center; max-width: 600px; margin: 0 auto 30px auto; }
        h1 { font-size: 28px; margin-bottom: 10px; color: #38bdf8; }
        p { color: #94a3b8; font-size: 15px; margin-bottom: 15px; }
        .controls { display: flex; gap: 10px; justify-content: center; margin-bottom: 20px; }
        input { flex: 1; max-width: 300px; padding: 12px; background: #1e293b; border: 1px solid #334155; border-radius: 8px; color: #fff; font-size: 14px; }
        input:focus { outline: none; border-color: #38bdf8; }
        button { padding: 12px 20px; background: #38bdf8; border: none; border-radius: 8px; color: #0f172a; font-weight: bold; cursor: pointer; font-size: 14px; }
        button:hover { background: #0ea5e9; }
        .status { text-align: center; color: #94a3b8; margin-bottom: 20px; font-size: 14px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; max-width: 1200px; margin: 0 auto; }
        .card { background: #1e293b; border: 1px solid #334155; padding: 20px; border-radius: 12px; display: flex; flex-direction: column; justify-content: space-between; }
        .type-badge { display: inline-block; padding: 4px 8px; background: #0369a1; color: #e0f2fe; border-radius: 6px; font-size: 11px; font-weight: bold; text-transform: uppercase; margin-bottom: 10px; align-self: flex-start; }
        .card h3 { font-size: 16px; margin-bottom: 10px; word-break: break-all; color: #f8fafc; }
        .key-box { background: #0f172a; padding: 10px; border-radius: 6px; font-family: monospace; font-size: 12px; max-height: 80px; overflow-y: auto; word-break: break-all; border: 1px solid #1e293b; margin-bottom: 15px; color: #cbd5e1; }
        .copy-btn { width: 100%; padding: 10px; background: #334155; color: #fff; border: none; border-radius: 6px; cursor: pointer; font-weight: 500; font-size: 13px; transition: 0.2s; }
        .copy-btn:hover { background: #475569; }
        .copy-btn.success { background: #22c55e; color: #fff; }
    </style>
</head>
<body>

    <header>
        <h1>VPN Key Aggregator</h1>
        <p>Автоматический поиск конфигураций и переименование в «Бесплатный VPN»</p>
        <div class="controls">
            <input type="text" id="search" placeholder="Поиск по номеру или типу..." oninput="filterKeys()">
            <button onclick="fetchKeys()">Обновить</button>
        </div>
        <div class="status" id="status">Нажмите «Обновить» для загрузки ключей...</div>
    </header>

    <div class="grid" id="container"></div>

    <script>
        // Открытый источник конфигураций
        const SOURCE_URL = 'https://githubusercontent.com';
        
        let allKeys = [];

        async function fetchKeys() {
            const statusEl = document.getElementById('status');
            const containerEl = document.getElementById('container');
            statusEl.innerText = "Поиск и обработка ключей...";
            containerEl.innerHTML = "";

            try {
                // Запрос к источнику через CORS-прокси
                const response = await fetch('https://allorigins.win' + encodeURIComponent(SOURCE_URL));
                if (!response.ok) throw new Error("Ошибка сети");
                
                const text = await response.text();
                const lines = text.split('\n').map(line => line.trim()).filter(line => line.length > 10);
                
                allKeys = lines.map((key, index) => {
                    // 1. Находим и определяем тип протокола
                    let type = "UNKNOWN";
                    if (key.startsWith("vless://")) type = "VLESS";
                    else if (key.startsWith("vmess://")) type = "VMess";
                    else if (key.startsWith("ss://")) type = "Shadowsocks";
                    else if (key.startsWith("ssr://")) type = "Shadowsocks R";
                    else if (key.startsWith("trojan://")) type = "Trojan";

                    // Новое название для карточки
                    const newName = `Бесплатный VPN #${index + 1}`;

                    // 2. Очищаем сам ключ от старого названия (удаляем всё после знака #)
                    let cleanKey = key;
                    if (key.includes('#')) {
                        cleanKey = key.split('#')[0];
                    }
                    
                    // 3. Добавляем новое имя прямо внутрь строки ключа (чтобы при импорте в приложение имя тоже менялось)
                    // Для vmess имя обычно зашито внутри base64, для остальных — идет после знака #
                    let finalKey = cleanKey;
                    if (type !== "VMess") {
                        finalKey = `${cleanKey}#${encodeURIComponent(newName)}`;
                    }

                    return { type, name: newName, rawKey: finalKey };
                });

                statusEl.innerText = `Успешно найдено и переименовано ключей: ${allKeys.length}`;
                render(allKeys);

            } catch (error) {
                console.error(error);
                statusEl.innerText = "Ошибка поиска данных. Попробуйте еще раз.";
            }
        }

        function render(data) {
            const container = document.getElementById('container');
            if (data.length === 0) {
                container.innerHTML = "<p style='grid-column: 1/-1; text-align: center;'>Ничего не найдено</p>";
                return;
            }

            container.innerHTML = data.map((item, idx) => `
                <div class="card">
                    <div>
                        <span class="type-badge">${item.type}</span>
                        <h3>${escapeHtml(item.name)}</h3>
                        <div class="key-box" id="key-${idx}">${escapeHtml(item.rawKey)}</div>
                    </div>
                    <button class="copy-btn" onclick="copyToClipboard('key-${idx}', this)">Копировать ключ</button>
                </div>
            `).join('');
        }

        function filterKeys() {
            const val = document.getElementById('search').value.toLowerCase();
            const filtered = allKeys.filter(item => 
                item.name.toLowerCase().includes(val) || 
                item.type.toLowerCase().includes(val)
            );
            render(filtered);
        }

        async function copyToClipboard(elementId, button) {
            const text = document.getElementById(elementId).innerText;
            try {
                await navigator.clipboard.writeText(text);
                const originalText = button.innerText;
                button.innerText = "Скопировано!";
                button.classList.add('success');
                setTimeout(() => {
                    button.innerText = originalText;
                    button.classList.remove('success');
                }, 1500);
            } catch (err) {
                alert('Не удалось скопировать');
            }
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
    </script>
</body>
</html>
